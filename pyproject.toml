[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "eq_model"
version = "0.1.0"
description = "PJM-calibrated long-run equilibrium model (planner benchmarks and risk-averse market regimes with E-SFPFC contracts)"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "highspy>=1.7",
                "matplotlib>=3.7", "tabulate>=0.9"]

[tool.setuptools]
packages = ["eq_model"]
