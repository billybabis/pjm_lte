name: run-model
# Title shown in the Actions list: the name given in the form, or the commit for push runs.
run-name: ${{ github.event.inputs.run_name || format('push {0}', github.sha) }}

# One matrix job per regime. Each job builds nothing but the solve: the panel is built once in
# the `panel` job and passed down as an artifact, so every regime sees identical inputs. The
# `combine` job stitches the per-regime row_*.json files back into a single summary.csv.

on:
  workflow_dispatch:
    inputs:
      run_name:
        description: "Name for this run (becomes its results folder, e.g. baseline, uniform_gamma)"
        required: true
        type: string
      regimes:
        description: "Comma-separated regimes, one matrix job each"
        default: "SP,DM,DM-FC,DM-FC-tau,DM-tau"
      gamma:
        description: "Risk aversion gamma"
        default: "1.25"
      gamma_scaling:
        description: "Per-technology gamma: capital = scaled by overnight capital cost (CCGT keeps gamma); none = same gamma for all"
        type: choice
        options: ["capital", "none"]
        default: "capital"
      workers:
        description: "Parallel yearly-dispatch processes inside each job (runner has 4 vCPU)"
        default: "3"
      tol:
        description: "Zero-profit convergence target as a fraction of annual capital cost (0.01 = 1%)"
        default: "0.01"
      tau_scc:
        description: "Carbon price $/tCO2 (priced into SP/DM-FC-tau/DM-tau; values emissions in every regime's welfare)"
        default: "280"
      params:
        description: "Extra --param overrides, space separated, e.g. voll=20000 markdown_mode=full"
        default: ""
      sweep_gammas:
        description: "Gamma sweep values (one matrix job each); leave empty to skip the sweep"
        default: ""
      sweep_regime:
        description: "Regime for the gamma sweep"
        default: "DM"
  push:
    branches: [main]
    paths: ["eq_model/**", ".github/workflows/run-model.yml"]

# A push cancels an earlier push run on the same branch; each manual dispatch gets its own group
# (keyed by run id), so several named runs can go side by side without cancelling each other.
concurrency:
  group: run-model-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'push' }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  REGIMES: ${{ github.event.inputs.regimes || 'SP,DM,DM-FC,DM-FC-tau,DM-tau' }}
  GAMMA: ${{ github.event.inputs.gamma || '1.25' }}
  WORKERS: ${{ github.event.inputs.workers || '3' }}
  EXTRA_PARAMS: ${{ github.event.inputs.params || '' }}
  TAU_SCC: ${{ github.event.inputs.tau_scc || '280' }}
  GAMMA_SCALING: ${{ github.event.inputs.gamma_scaling || 'capital' }}
  TOL: ${{ github.event.inputs.tol || '0.01' }}

jobs:
  # ---------------------------------------------------------------- fan-out keys
  setup:
    runs-on: ubuntu-latest
    outputs:
      regimes: ${{ steps.split.outputs.regimes }}
      gammas: ${{ steps.split.outputs.gammas }}
      run_sweep: ${{ steps.split.outputs.run_sweep }}
    steps:
      - id: split
        shell: bash
        env:
          SWEEP_GAMMAS: ${{ github.event.inputs.sweep_gammas }}
        run: |
          to_json () { python3 -c "import json,sys; print(json.dumps([s.strip() for s in sys.argv[1].split(',') if s.strip()]))" "$1"; }
          echo "regimes=$(to_json "$REGIMES")" >> "$GITHUB_OUTPUT"
          echo "gammas=$(to_json "${SWEEP_GAMMAS:-0}")" >> "$GITHUB_OUTPUT"
          if [ -n "$SWEEP_GAMMAS" ]; then echo "run_sweep=true" >> "$GITHUB_OUTPUT"; else echo "run_sweep=false" >> "$GITHUB_OUTPUT"; fi
      # Record the run's name and settings, so fetch_run.py can file the results under that name.
      - name: run info
        shell: bash
        env:
          RUN_NAME: ${{ github.event.inputs.run_name }}
        run: |
          python3 - <<'PY'
          import json, os
          info = {k.lower(): os.environ.get(k, "") for k in
                  ("RUN_NAME", "REGIMES", "GAMMA", "GAMMA_SCALING", "TAU_SCC", "EXTRA_PARAMS", "TOL")}
          info["run_id"] = os.environ.get("GITHUB_RUN_ID", "")
          info["sha"] = os.environ.get("GITHUB_SHA", "")
          json.dump(info, open("run_info.json", "w"), indent=2)
          print(json.dumps(info, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: run-info
          path: run_info.json
          retention-days: 30

  # ---------------------------------------------------------------- panel, built once
  panel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: check-load
        run: python -m eq_model check-load --load data/raw/load
      - name: build-panel
        run: |
          python -m eq_model build-panel \
            --load data/raw/load --gen data/raw/gen_by_fuel \
            --capacity data/raw/capacity/vre_capacity.csv \
            --eia-active data/raw/capacity/generators_active_07_2026.csv \
            --eia-retired data/raw/capacity/generators_retired_07_2026.csv \
            --save-capacity vre_capacity_with_coverage.csv \
            --out panel.npz
      - uses: actions/upload-artifact@v4
        with:
          name: panel
          path: |
            panel.npz
            vre_capacity_with_coverage.csv
          retention-days: 7

  # ---------------------------------------------------------------- one job per regime
  regime:
    needs: [setup, panel]
    runs-on: ubuntu-latest
    timeout-minutes: 350        # GitHub-hosted jobs are killed at 360
    strategy:
      fail-fast: false          # a diverging regime must not cancel the others
      max-parallel: 7
      matrix:
        regime: ${{ fromJSON(needs.setup.outputs.regimes) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: panel
      - name: solve ${{ matrix.regime }}
        env:
          REGIME: ${{ matrix.regime }}
        run: |
          # The repo has files committed under results/, and this job uploads the whole directory;
          # without this they ride along in every artifact as stale results.
          rm -rf results
          # tau_scc is just a --param, given its own prefilled input. It enters the agents'
          # costs only in the carbon-priced regimes (SP, DM-FC-tau, DM-tau), but it also values emissions
          # in EVERY regime's welfare metric (welfare_tau_always_scc), which is what makes the
          # regimes comparable - so it is passed to all of them, not only the priced ones.
          PARAMS="gamma_scaling=$GAMMA_SCALING $EXTRA_PARAMS"
          if [ -n "$TAU_SCC" ]; then PARAMS="$PARAMS tau_scc=$TAU_SCC"; fi
          python -m eq_model run \
            --panel panel.npz \
            --regimes "$REGIME" \
            --gamma "$GAMMA" \
            --workers "$WORKERS" \
            --tol "$TOL" \
            --out "results/gamma$GAMMA" \
            $(for p in $PARAMS; do printf -- '--param %s ' "$p"; done)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.regime }}
          path: results/
          retention-days: 30

  # ---------------------------------------------------------------- one job per gamma
  sweep:
    needs: [setup, panel]
    if: needs.setup.outputs.run_sweep == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        gamma: ${{ fromJSON(needs.setup.outputs.gammas) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: panel
      - name: sweep gamma=${{ matrix.gamma }}
        env:
          SWEEP_REGIME: ${{ github.event.inputs.sweep_regime || 'DM' }}
          GAMMA_VALUE: ${{ matrix.gamma }}
        run: |
          # The repo has files committed under results/, and this job uploads the whole directory;
          # without this they ride along in every artifact as stale results.
          rm -rf results
          # tau_scc is just a --param, given its own prefilled input. It enters the agents'
          # costs only in the carbon-priced regimes (SP, DM-FC-tau, DM-tau), but it also values emissions
          # in EVERY regime's welfare metric (welfare_tau_always_scc), which is what makes the
          # regimes comparable - so it is passed to all of them, not only the priced ones.
          PARAMS="gamma_scaling=$GAMMA_SCALING $EXTRA_PARAMS"
          if [ -n "$TAU_SCC" ]; then PARAMS="$PARAMS tau_scc=$TAU_SCC"; fi
          python -m eq_model sweep \
            --panel panel.npz \
            --regime "$SWEEP_REGIME" \
            --gammas "$GAMMA_VALUE" \
            --workers "$WORKERS" \
            --tol "$TOL" \
            --out "results/sweep" \
            $(for p in $PARAMS; do printf -- '--param %s ' "$p"; done)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sweep-gamma${{ matrix.gamma }}
          path: results/
          retention-days: 30

  # ---------------------------------------------------------------- stitch it back together
  combine:
    needs: [setup, regime, sweep]
    if: always() && needs.regime.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          path: downloaded
          pattern: results-*
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: downloaded-sweep
          pattern: sweep-gamma*
      - name: combine
        run: |
          mkdir -p combined
          python -m eq_model combine downloaded --regimes "$REGIMES" --out combined/summary.csv
          if [ -d downloaded-sweep ] && compgen -G 'downloaded-sweep/*' > /dev/null; then
            python -m eq_model combine downloaded-sweep --by-gamma --out combined/sweep.csv
          fi
      - name: figure
        run: |
          python -m eq_model plot downloaded --regimes "$REGIMES" --out combined/capacity.pdf
          python -m eq_model plot downloaded --regimes "$REGIMES" --out combined/capacity.png
      - name: job summary
        run: |
          {
            echo '## summary (gamma='"$GAMMA"')'
            echo
            python -c "import pandas as pd,sys; print(pd.read_csv('combined/summary.csv').to_markdown(index=False))" 2>/dev/null \
              || { echo '```'; cat combined/summary.csv; echo '```'; }
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: summary
          path: combined/
          retention-days: 90
